<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundWave Player</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7928ca">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>🎵 SoundWave</h1>
      <p>Seu Player de Música PWA</p>
    </header>

    <main class="player-card">
      <div class="album-cover" id="albumCover">
        <span class="cover-icon">🎧</span>
      </div>

      <div class="track-info">
        <h2 id="songTitle">Nenhuma música selecionada</h2>
        <p id="artistName">Escolha um arquivo MP3 do celular</p>
      </div>

      <!-- Elemento do Áudio em HTML5 -->
      <audio id="audioPlayer"></audio>

      <!-- Botão para carregar música local -->
      <label for="fileInput" class="btn-select">
        📂 Carregar Música
      </label>
      <input type="file" id="fileInput" accept="audio/*">

      <!-- Barra de Progresso do Áudio -->
      <div class="progress-wrapper" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="time-display">
        <span id="currentTime">00:00</span>
        <span id="durationTime">00:00</span>
      </div>

      <!-- Controles de Reprodução -->
      <div class="controls">
        <button class="btn-ctrl" id="btnPrev">⏮️</button>
        <button class="btn-ctrl btn-main" id="btnPlay">▶️</button>
        <button class="btn-ctrl" id="btnNext">⏭️</button>
      </div>
    </main>

    <!-- Botão Flutuante de Instalação PWA -->
    <button class="btn-install" id="btnInstalar">
      📲 Instalar Aplicativo
    </button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
